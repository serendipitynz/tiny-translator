[package]
name = "tiny-translator"
version = "0.1.0"
description = "A small desktop translator that runs PLaMo 3 Translate locally"
authors = ["Takuya Otani"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; without it the two collide on
# Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "tiny_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
html5gum = "0.9.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
whatlang = "=0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

# Tauri offers no way to turn off WebView2's browser keys (TASK-27), so the app reaches the WebView2
# settings itself. Both are the versions wry already pulls in.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# `tauri dev` builds unoptimised, where hashing a 1.8 GB GGUF would take tens of seconds instead of
# about one (doc-1 §10.4).
[profile.dev.package.sha2]
opt-level = 3
